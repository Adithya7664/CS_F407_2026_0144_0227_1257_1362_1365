name: Deploy replay viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate replays (seeds 1-60)
        working-directory: src/exercise2
        run: python export_replay.py 1 60
      - name: Copy replays and Python sources into the site
        run: |
          cp -r src/exercise2/replays docs/replays
          mkdir -p docs/py
          cp src/exercise2/{config2,grid_gen2,agent2,export_replay,live}.py docs/py/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
